name: Unpack project archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event.head_commit.message != 'chore: unpack project archive' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive into repository root
        run: |
          rm -rf /tmp/galkan-vpn
          mkdir -p /tmp/galkan-vpn
          unzip -q galkan-vpn-amneziawg3-updated.zip -d /tmp/galkan-vpn
          cp -a /tmp/galkan-vpn/galkan-vpn-main/. .
          rm -rf .pytest_cache
          rm -f galkan-vpn-amneziawg3-updated.zip
          rm -f .github/workflows/unpack.yml
      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: unpack project archive"
          git push
